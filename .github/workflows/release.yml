name: Release Draft

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Release Cli
        uses: robinraju/release-downloader@v1.13
        with:
          repository: "Mmx233/GoReleaseCli"
          latest: true
          fileName: "release_linux_amd64.tar.gz"
          extract: true
          out-file-path: "./build/"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Generate ent code
        run: go generate ./internal/ent

      - name: Build
        env:
          NAME: action-cache-server
        run: |
          ./build/release ./cmd/server --extra-arches --output build/output \
            --name "$NAME" \
            --ldflags="$LDFLAGS" \
            -c tar.gz

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: build/output/*.tar.gz
